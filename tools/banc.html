<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Banc d'essai – Déco</title>
<style>body { margin: 0; font: 14px system-ui; } iframe { border: 0; width: 412px; height: 1400px; } pre { white-space: pre-wrap; }</style>
</head>
<body>
<iframe id="f"></iframe>
<pre id="out"></pre>
<script>
// Banc d'essai : l'appli tourne dans un cadre où le réseau et l'heure sont simulés, pour des résultats
// reproductibles. Utilisé par tools/verifier.sh ; ouvrable aussi à la main (tools/banc.html#parcours).
//   #verdicts            verdicts de tous les sites, heure par heure (comparés à tools/attendu.txt)
//   #parcours            les gestes courants, avec leurs contrôles
//   #lent                Open-Meteo ne répond plus : l'appli doit retomber sur le cache
//   #tableau, #deco…     un écran, pour les captures
// Le banc efface le stockage local : publié avec l'appli sur GitHub Pages, il viderait tes sites.
// Il ne tourne donc qu'en local.
if (!["localhost", "127.0.0.1"].includes(location.hostname)) {
  document.body.textContent = "Banc d'essai : à lancer en local uniquement (tools/verifier.sh).";
  throw new Error("banc hors local");
}

const SITES = [
  { id: "sapenay", name: "Sapenay", lat: 45.8109, lon: 5.8657, alt: 890, secMin: 225, secMax: 315, piou: 1446, note: "Déco ouest." },
  { id: "sthilaire", name: "Saint-Hilaire", lat: 45.3069, lon: 5.8881, alt: 1000, secMin: 45, secMax: 135, note: "" },
  { id: "aiguebelette", name: "Aiguebelette", lat: 45.6016, lon: 5.8073, alt: 1120, secMin: 200, secMax: 315, note: "" },
  { id: "marennes", type: "gonflage", name: "Marennes", lat: 45.6154, lon: 4.9038, alt: 230, secMin: 315, secMax: 45, note: "Pente école." },
  { id: "miribel", type: "gonflage", name: "Miribel-Jonage", lat: 45.7936, lon: 4.9578, alt: 175, secMin: 135, secMax: 225, note: "" },
  { id: "rebat", type: "gonflage", name: "Le Rebat", lat: 45.8651, lon: 4.7935, alt: 450, secMin: 285, secMax: 15, note: "" }
];
localStorage.clear();
localStorage.setItem("sites", JSON.stringify(SITES));
localStorage.setItem("presets", JSON.stringify(SITES.map((s) => s.id)));

// Injecté en tête de la page de l'appli : heure figée à midi, réseau simulé, pas de service worker.
// window.__lent fait pendre Open-Meteo jusqu'à l'abandon par l'appli (délai de fetchT).
const mock = (fx) => `<base href="${new URL("..", location.href)}"><script>
  const FX = ${fx}, SITES = ${JSON.stringify(SITES)};
  const NOON = new Date(FX[0].hourly.time[12] + ":00+02:00").getTime();
  Date.now = () => NOON;
  if (navigator.serviceWorker) navigator.serviceWorker.register = () => Promise.resolve();
  window.__requetes = [];
  const real = window.fetch.bind(window);
  const json = (o) => Promise.resolve(new Response(JSON.stringify(o), { headers: { "Content-Type": "application/json" } }));
  const pend = (o) => new Promise((_, ko) => o && o.signal && o.signal.addEventListener("abort", () => ko(o.signal.reason)));
  window.fetch = (u, o) => {
    const url = new URL(String(u), document.baseURI);
    __requetes.push(url.href);
    if (url.hostname === "api.open-meteo.com" && url.pathname === "/v1/forecast") {
      if (window.__lent) return pend(o);
      const list = url.searchParams.get("latitude").split(",").map((la) => FX[SITES.findIndex((s) => String(s.lat) === la)]);
      return json(list.length === 1 ? list[0] : list);
    }
    if (url.pathname.startsWith("/v1/live/")) return json({ data: { id: 1446, meta: { name: "Déco SAPENAY 901m" }, status: { state: "on" },
      measurements: { date: new Date(NOON).toISOString(), wind_speed_avg: 14, wind_speed_max: 22, wind_heading: 260 } } });
    if (url.pathname.startsWith("/v1/archive/")) return json({ data: Array.from({ length: 25 }, (_, i) =>
      [new Date(NOON - (24 - i) * 300000).toISOString(), 0, 0, 0, 6 + i * 0.4, 12 + i * 0.5, 250 + i]) });
    if (url.pathname.startsWith("/v1/live-with-meta")) return json({ data: [] });
    if (url.hostname === "api.open-meteo.com") return json({ elevation: [500] });
    return real(u, o);
  };
<\/script>`;

const step = location.hash.slice(1) || "parcours";
const f = document.getElementById("f"), out = document.getElementById("out");
const wait = (ms) => new Promise((ok) => setTimeout(ok, ms));
const lines = [], errors = [];
const check = (ok, name, detail = "") => lines.push(`${ok ? "OK" : "KO"} ${name}${detail ? ` : ${detail}` : ""}`);

(async () => {
  const fx = await (await fetch("prevision-figee.json")).text();
  const page = await (await fetch("../index.html")).text();
  f.srcdoc = page.replace("<head>", "<head>" + mock(fx));
  await new Promise((ok) => { f.onload = ok; });
  const W = f.contentWindow, D = f.contentDocument;
  W.addEventListener("error", (e) => errors.push(e.message));
  W.addEventListener("unhandledrejection", (e) => errors.push(String(e.reason && e.reason.stack || e.reason)));
  await wait(1500);
  const deco = W.deco, t = (s) => [...D.querySelectorAll(s)].map((e) => e.textContent.replace(/\s+/g, " ").trim());
  const day = (n) => deco.state.ov.rows[0].days[n].date;

  if (step === "verdicts") {
    out.textContent = JSON.stringify(deco.state.ov.rows.map((r) => ({ id: r.s.id, days: r.days.map((d) => ({
      date: d.date, v: d.verdict, agree: d.agree, models: d.models.map((x) => [x.m, x.level, x.win]),
      hours: d.hours.map((h) => [h.hour, h.past, h.ev.level, h.ev.base, h.ev.reasons.map((x) => [x.l, x.tag || "", x.msg]), (h.ens || []).map((e) => [e.ws, e.wg])])
    })) })));
    return;
  }

  if (step === "parcours") {
    try {
      check(t(".ov .nm b").length === 6, "tableau", t(".ov .nm b").join(", "));
      check(t(".ov .grp").join("/") === "Vol/Gonflage face voile", "groupes du tableau", t(".ov .grp").join(" / "));
      const passees = deco.state.ov.rows[0].days[0].hours.filter((h) => h.past).map((h) => h.hour);
      check(passees.join() === "7,8,9,10,11", "à midi, les heures passées d'aujourd'hui sont écartées", `${passees.join(", ")} h`);
      D.querySelector(`.ov .c[data-ov-site="sapenay"][data-ov-date="${day(1)}"]`).click(); await wait(800);
      check(deco.state.view === "site" && t("#siteName")[0] === "Sapenay", "ouvrir une case", t("#siteName").join());
      check(deco.state.days[deco.state.dayIdx].date === day(1), "jour de la case", t('.day[aria-selected="true"] .d1').join());
      check(!!D.querySelector("#live .trend svg") && t("#live .reasons li").some((x) => x.includes("forcit")), "balise et tendance", t("#live .reasons li").join(" / "));
      D.querySelector('.day[data-day="4"]').click();
      check(t(".verdict .why").some((x) => x.includes("J+4")), "tendance à J+4", t(".verdict .why").join(" / "));
      D.querySelector(".hour[data-hour='15']").click();
      check(t(".detail h2")[0] === "15 h" && t(".ens").length === 1, "détail de l'heure", t(".ens").join());
      D.getElementById("limitsBtn").click(); D.querySelector('[data-level="confirme"]').click();
      check(t("#levelHint")[0].startsWith("Repères confirmé"), "niveau dans la feuille", t("#levelHint").join());
      D.querySelector("#limitsForm [type=submit]").click(); await wait(200);
      check(deco.state.limits.maxWind === 30 && JSON.parse(localStorage.getItem("limits")).maxWind === 30, "limites enregistrées");
      D.getElementById("limitsBtn").click(); D.querySelector('[data-level="debutant"]').click(); D.querySelector("#limitsForm [type=submit]").click(); await wait(200);
      D.getElementById("backBtn").click(); await wait(800);
      check(deco.state.view === "overview" && D.getElementById("live").innerHTML === "", "retour au tableau");
      D.querySelector("[data-model]").click(); D.querySelector('#modelForm input[value="icon_seamless"]').checked = true;
      D.querySelector("#modelForm [type=submit]").click(); await wait(800);
      const last = W.__requetes.filter((u) => u.includes("/v1/forecast")).at(-1);
      check(new URL(last).searchParams.get("models") === "icon_seamless,meteofrance_seamless,ecmwf_ifs025", "modèle météo", new URL(last).searchParams.get("models"));
      D.querySelector("[data-model]").click(); D.querySelector('#modelForm input[value="best_match"]').checked = true;
      D.querySelector("#modelForm [type=submit]").click(); await wait(800);
      D.getElementById("sitesBtn").click();
      const q = D.getElementById("pge-q"); q.focus(); q.value = "planfait"; q.dispatchEvent(new Event("input")); await wait(800);
      check(t("#pgeResults .pge-pick b").includes("Annecy - Planfait"), "recherche par nom", t("#pgeResults .pge-pick b").join());
      D.querySelector("#pgeResults [data-pge-add]").click(); await wait(800);
      check(deco.state.sites.length === 7 && t("#pgeResults .pge-done").length === 1, "ajout direct", deco.state.sites.map((s) => s.id).join());
      q.value = "sapenay pass"; q.dispatchEvent(new Event("input")); await wait(500);
      D.querySelector("#pgeResults .pge-pick").click(); await wait(800);
      const fv = (k) => D.getElementById("siteForm").elements.namedItem(k).value;
      check(fv("name") === "Sapenay (pass)" && fv("secMin") === "248" && fv("secMax") === "292", "formulaire rempli", `${fv("name")} ${fv("secMin")}–${fv("secMax")}`);
      D.getElementById("siteSubmit").click(); await wait(800);
      check(t(".ov .nm b").length === 8, "ajout par le formulaire", t(".ov .nm b").join(", "));
      D.getElementById("sitesBtn").click(); D.querySelector('#sitesList [data-edit="marennes"]').click();
      check(D.getElementById("sf-type").value === "gonflage" && D.getElementById("pgeSearch").hidden, "modifier un terrain");
      D.getElementById("siteCancel").click();
      W.confirm = () => true; D.getElementById("sitesBtn").click();
      for (const id of deco.state.sites.map((s) => s.id)) { D.querySelector(`#sitesList [data-del="${id}"]`).click(); await wait(150); }
      await wait(500); D.getElementById("sitesDlg").close();
      check(t(".welcome h2")[0] === "Bienvenue" && localStorage.getItem("sites") === "[]", "tout supprimer ramène à l'accueil");
    } catch (e) { check(false, "parcours interrompu", e.message); }
    check(!errors.length, "aucune erreur JS", errors.join(" | "));
    out.textContent = lines.join("\n");
    return;
  }

  if (step === "lent") {
    W.__lent = true;
    D.getElementById("refreshBtn").click();
    await wait(9000); // le délai de fetchT (8 s) s'écoule
    check(t(".banner").some((x) => x.includes("Réseau trop lent") && x.includes("dernières prévisions")), "bannière réseau lent", t(".banner").join());
    check(t(".ov .nm b").length === 6, "le tableau reste affiché depuis le cache", `${t(".ov .nm b").length} lignes`);
    check(!D.getElementById("refreshBtn").classList.contains("spin"), "le chargement s'arrête");
    check(!errors.length, "aucune erreur JS", errors.join(" | "));
    out.textContent = lines.join("\n");
    return;
  }

  // Écrans pour les captures
  if (step === "deco") deco.openSite("sapenay", day(1));
  if (step === "jour") deco.openSite("sapenay", day(0));
  if (step === "gonflage") deco.openSite("marennes", day(2));
  if (step === "limites") D.getElementById("limitsGBtn").click();
  if (step === "sites") D.getElementById("sitesBtn").click();
  if (step === "modele") D.querySelector("[data-model]").click();
})();
</script>
</body>
</html>
