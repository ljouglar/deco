<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15303F">
<meta name="description" content="Conditions de vol parapente jusqu'à J+5 pour vos sites">
<title>Déco</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #EEF3F6; --surface: #FFFFFF; --ink: #15303F; --muted: #5E7684; --line: #D3DEE5;
  --action: #2459C6; --on-action: #FFFFFF; --wing: #F0B429;
  --go: #2E9D6A; --warn: #DE9418; --stop: #CF4436;
  --go-soft: #E2F3EA; --warn-soft: #FBF0DC; --stop-soft: #F8E3E0;
  --sans: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --cond: "Barlow Condensed", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0F1E27; --surface: #172A35; --ink: #E6EEF2; --muted: #8FA6B2; --line: #26404D;
    --action: #7BA4F5; --on-action: #0F1E27; --go-soft: #173A2C; --warn-soft: #3D3018; --stop-soft: #43211E;
  }
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font: 16px/1.45 var(--sans); -webkit-tap-highlight-color: transparent; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--action); outline-offset: 2px; }

.app { max-width: 560px; margin: 0 auto; padding: 0 16px 32px; }

/* Header */
.top { display: flex; align-items: center; gap: 8px; padding: 12px 0 8px; }
.site-btn { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 4px 0; }
.site-btn .name { display: block; font: 700 1.75rem/1.05 var(--cond); letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.site-btn .meta { display: block; font-size: .85rem; color: var(--muted); }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; flex: none; }
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn.spin svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Day tabs */
.days { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; margin: 8px 0 14px; }
.day { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 4px; text-align: center; position: relative; min-width: 0; }
.day .d1 { display: block; font-weight: 600; font-size: .95rem; }
.day .d2 { display: block; font-size: .8rem; color: var(--muted); }
.day .pip { position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; border-radius: 50%; }
.day[aria-selected="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }

/* Verdict */
.verdict { border-radius: 20px; padding: 18px 18px 16px; display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; background: var(--surface); border-left: 8px solid var(--muted); }
.verdict.l0 { border-left-color: var(--go); background: var(--go-soft); }
.verdict.l1 { border-left-color: var(--warn); background: var(--warn-soft); }
.verdict.l2 { border-left-color: var(--stop); background: var(--stop-soft); }
.verdict h1 { margin: 0; font: 700 2.6rem/0.95 var(--cond); letter-spacing: -.005em; }
.verdict .window { margin: 6px 0 0; font: 500 1.25rem/1.2 var(--cond); }
.verdict .why { margin: 8px 0 0; font-size: .9rem; color: var(--muted); }
.dial { width: 124px; height: 124px; }
.dial .ring { fill: none; stroke: var(--line); stroke-width: 1.5; }
.dial .sector { fill: var(--go); opacity: .28; }
.dial .card { fill: var(--muted); font: 600 9px var(--sans); text-anchor: middle; dominant-baseline: central; }
.dial .w10 { stroke: var(--ink); stroke-width: 3.5; stroke-linecap: round; }
.dial .w850 { stroke: var(--action); stroke-width: 2; stroke-dasharray: 4 3; stroke-linecap: round; }
.dial .wlive { stroke: var(--wing); stroke-width: 3; stroke-linecap: round; }
.dial-legend { font-size: .75rem; color: var(--muted); text-align: center; margin-top: 2px; }
.dial-legend i { display: inline-block; width: 14px; height: 0; border-top: 3px solid var(--ink); vertical-align: middle; margin-right: 3px; }
.dial-legend i.alt { border-top: 2px dashed var(--action); margin-left: 6px; }
.dial-legend i.bal { border-top: 3px solid var(--wing); margin-left: 6px; }

/* Hour detail */
.detail { margin: 12px 0 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
.detail h2 { margin: 0 0 8px; font: 700 1.2rem var(--cond); }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 8px; margin: 0 0 10px; }
.facts div { min-width: 0; }
.facts dt { font-size: .75rem; color: var(--muted); }
.facts dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
.reasons { list-style: none; margin: 0; padding: 0; font-size: .92rem; }
.reasons li { display: flex; gap: 8px; align-items: baseline; padding: 3px 0; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; transform: translateY(-1px); }
.dot.l0 { background: var(--go); } .dot.l1 { background: var(--warn); } .dot.l2 { background: var(--stop); }
.site-note { margin: 10px 0 0; font-size: .85rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 8px; }

/* Balise : mesure en temps réel */
.live { margin: 6px 0 0; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 13px 16px 14px; }
.live h2 { margin: 0; font: 700 1.2rem/1 var(--cond); display: flex; align-items: center; gap: 7px; letter-spacing: .02em; text-transform: uppercase; }
.live h2 .age { margin-left: auto; font: 400 .78rem/1.2 var(--sans); color: var(--muted); white-space: nowrap; text-transform: none; letter-spacing: 0; }
.live h2 .pulse { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--wing); animation: pulse 2.4s ease-out infinite; }
.live h2 .pulse.off { background: var(--muted); animation: none; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(240, 180, 41, .55); } 70%, 100% { box-shadow: 0 0 0 8px rgba(240, 180, 41, 0); } }
.live .bname { display: block; margin: 4px 0 10px; font-size: .8rem; color: var(--muted); }
.live .cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.live .col { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 9px 11px; }
.live .col .lbl { display: block; font-size: .75rem; color: var(--muted); }
.live .col .val { display: flex; align-items: center; gap: 6px; font-weight: 600; font-variant-numeric: tabular-nums; }
.live .col .val svg { width: 18px; height: 18px; flex: none; }
.live .col small { display: block; color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums; }
.live .col.meas .val svg { color: var(--wing); }
.live .stale { margin: 10px 0 0; font-size: .85rem; color: var(--muted); }

/* Hourly table */
.hours-head, .hour { display: grid; grid-template-columns: 44px 1.35fr 1fr 1fr 18px; align-items: center; gap: 6px; }
.hours-head { font-size: .75rem; color: var(--muted); padding: 0 10px 6px 14px; }
.hours { display: flex; flex-direction: column; gap: 4px; }
.hour { width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--muted); border-radius: 10px; padding: 9px 10px; font-variant-numeric: tabular-nums; }
.hour.l0 { border-left-color: var(--go); } .hour.l1 { border-left-color: var(--warn); } .hour.l2 { border-left-color: var(--stop); }
.hour.closed { opacity: .55; }
.hour[aria-pressed="true"] { border-color: var(--ink); border-left-width: 5px; box-shadow: inset 0 0 0 1px var(--ink); }
.hour .h { font: 700 1.1rem var(--cond); }
.hour .w { display: flex; align-items: center; gap: 6px; }
.hour .w svg { width: 18px; height: 18px; flex: none; }
.hour .w b { font-weight: 600; }
.hour small { color: var(--muted); font-size: .8rem; }
.hour .sky { font-size: .85rem; }

.status { margin: 18px 0 0; font-size: .8rem; color: var(--muted); }
.status p { margin: 4px 0; }
.banner { margin: 0 0 12px; padding: 10px 12px; border-radius: 10px; background: var(--warn-soft); font-size: .9rem; }
.empty { padding: 40px 0; text-align: center; color: var(--muted); }

/* Bottom bar */
.bar { display: flex; gap: 8px; margin-top: 18px; }
.bar button { flex: 1; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px; font-weight: 600; }

/* Dialogs */
dialog { width: min(560px, 100%); max-height: 92vh; margin: auto auto 0; border: 0; border-radius: 20px 20px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--surface); color: var(--ink); }
dialog::backdrop { background: rgba(10, 25, 33, .5); }
dialog h2 { margin: 0 0 12px; font: 700 1.5rem var(--cond); }
dialog h3 { margin: 18px 0 8px; font: 700 1.1rem var(--cond); }
.field { display: grid; grid-template-columns: 1fr 96px; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.field span small { display: block; color: var(--muted); font-size: .78rem; }
.field.wide { grid-template-columns: 1fr 1.1fr; }
.field input, .field select { width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); text-align: right; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stack label { display: block; font-size: .8rem; color: var(--muted); margin-top: 8px; }
.stack input { width: 100%; padding: 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.site-row { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.site-row .info { flex: 1; min-width: 0; }
.site-row .info b { display: block; }
.site-row .info small { color: var(--muted); }
.btn { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 9px 12px; font-weight: 600; }
.btn.primary { background: var(--action); border-color: var(--action); color: var(--on-action); }
.btn.danger { color: var(--stop); }
.actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
.hint { font-size: .8rem; color: var(--muted); margin: 6px 0 0; }

@media (prefers-reduced-motion: reduce) { .icon-btn.spin svg, .live h2 .pulse { animation: none; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="site-btn" id="siteBtn" aria-label="Changer de site">
      <span class="name" id="siteName">…</span>
      <span class="meta" id="siteMeta"></span>
    </button>
    <button class="icon-btn" id="refreshBtn" aria-label="Actualiser les prévisions">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
    </button>
  </header>

  <div id="live"></div>

  <nav class="days" id="days" role="tablist" aria-label="Jour"></nav>
  <div id="banner"></div>
  <main id="main"><p class="empty">Chargement des prévisions…</p></main>

  <div class="bar">
    <button id="sitesBtn">Mes sites</button>
    <button id="limitsBtn">Mes limites</button>
  </div>

  <footer class="status" id="status"></footer>
</div>

<dialog id="limitsDlg">
  <h2>Mes limites</h2>
  <form method="dialog" id="limitsForm"></form>
</dialog>

<dialog id="sitesDlg">
  <h2>Mes sites</h2>
  <div id="sitesList"></div>
  <h3 id="siteFormTitle">Ajouter un site</h3>
  <form id="siteForm" class="stack" autocomplete="off">
    <input type="hidden" name="id">
    <label for="sf-name">Nom</label>
    <input id="sf-name" name="name" required placeholder="Ex. Planfait">
    <div class="grid2">
      <div><label for="sf-lat">Latitude</label><input id="sf-lat" name="lat" type="number" step="any" required></div>
      <div><label for="sf-lon">Longitude</label><input id="sf-lon" name="lon" type="number" step="any" required></div>
    </div>
    <div class="grid2">
      <div><label for="sf-alt">Altitude du déco (m)</label><input id="sf-alt" name="alt" type="number" required></div>
      <div style="align-self:end"><button type="button" class="btn" id="geoBtn" style="width:100%">Ma position</button></div>
    </div>
    <div class="grid2">
      <div><label for="sf-min">Vent favorable de (°)</label><input id="sf-min" name="secMin" type="number" min="0" max="359" required></div>
      <div><label for="sf-max">à (°)</label><input id="sf-max" name="secMax" type="number" min="0" max="359" required></div>
    </div>
    <p class="hint">Direction d'où vient le vent, sens horaire : 270 = ouest. Un déco ouest se règle par exemple de 225 à 315.</p>
    <label for="sf-piou">Balise Pioupiou (numéro, facultatif)</label>
    <input id="sf-piou" name="piou" type="number" inputmode="numeric" min="1" step="1" placeholder="Ex. 1446">
    <p class="hint">Numéro de la station sur <a href="https://www.openwindmap.org/" target="_blank" rel="noopener">openwindmap.org</a> : il apparaît dans l'adresse de la balise (PIOU_1446).</p>
    <label for="sf-note">Note (règles du site, plafond…)</label>
    <input id="sf-note" name="note">
    <div class="actions">
      <button type="button" class="btn" id="siteCancel">Fermer</button>
      <button type="submit" class="btn primary" id="siteSubmit">Ajouter le site</button>
    </div>
  </form>
</dialog>

<script>
"use strict";

// ---------- Configuration ----------
const DEFAULT_SITES = [{
  id: "sapenay", name: "Sapenay", lat: 45.8109, lon: 5.8657, alt: 890, secMin: 225, secMax: 315, piou: 1446,
  note: "Déco ouest. Approche de Chambéry-Aix : ne pas monter à plus de 300 m au-dessus du déco. Vent d'est = déco sous le vent."
}, {
  id: "sthilaire", name: "Saint-Hilaire", lat: 45.3069, lon: 5.8881, alt: 1000, secMin: 45, secMax: 135, piou: 1333,
  note: "Déco est au-dessus de Lumbin. Deux décos : le Nord (tapis, confortable) peut se retrouver sous le vent de la brise, le Sud (herbe) prend mieux la brise de face. Atterro officiel à Lumbin."
}, {
  id: "aiguebelette", name: "Aiguebelette", lat: 45.6016, lon: 5.8073, alt: 1120, secMin: 200, secMax: 315, piou: 1722,
  note: "Déco des Provinces (l'Épine), face ouest sur le lac. La brise monte souvent après 13 h : la balise mesure surtout cette brise, pas le vent météo."
}];

const DEFAULT_LIMITS = {
  maxWind: 20,      // vent moyen max au déco (km/h)
  maxGust: 25,      // rafales max (km/h)
  maxGustDelta: 10, // écart rafales - vent moyen (km/h)
  maxAlt: 25,       // vent max vers 1500 m / 850 hPa (km/h)
  capeWarn: 400,    // J/kg : instable
  capeStop: 1000,   // J/kg : risque orageux
  minBase: 500,     // base des nuages mini au-dessus du déco (m)
  startHour: 9, endHour: 18, model: "best_match"
};

const MODELS = {
  best_match: "Automatique",
  meteofrance_seamless: "Météo-France (AROME)",
  icon_seamless: "ICON (DWD)",
  ecmwf_ifs025: "ECMWF"
};

const FORECAST_DAYS = 6; // aujourd'hui + 5 jours ; au-delà de J+2, c'est une tendance

const HOURLY = [
  "temperature_2m", "dew_point_2m", "precipitation_probability", "precipitation",
  "cloud_cover_low", "cloud_cover_mid", "cloud_cover_high",
  "wind_speed_10m", "wind_direction_10m", "wind_gusts_10m",
  "wind_speed_850hPa", "wind_direction_850hPa", "wind_speed_700hPa", "wind_direction_700hPa",
  "cape", "boundary_layer_height"
];

const LIMIT_FIELDS = [
  ["maxWind", "Vent moyen max", "au déco, km/h"],
  ["maxGust", "Rafales max", "km/h"],
  ["maxGustDelta", "Écart rafales / vent", "irrégularité tolérée, km/h"],
  ["maxAlt", "Vent max vers 1500 m", "850 hPa, km/h"],
  ["capeWarn", "Instabilité : vigilance", "CAPE, J/kg"],
  ["capeStop", "Instabilité : orage", "CAPE, J/kg"],
  ["minBase", "Base des nuages mini", "m au-dessus du déco"],
  ["startHour", "Début de journée", "heure"],
  ["endHour", "Fin de journée", "heure"]
];

// ---------- Storage ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

// Les sites livrés avec l'appli rejoignent ceux déjà enregistrés, sans écraser tes réglages.
function withDefaults(saved) {
  if (!Array.isArray(saved) || !saved.length) return DEFAULT_SITES.map((d) => ({ ...d }));
  const out = saved.map((s) => ({ ...s }));
  for (const d of DEFAULT_SITES) {
    const cur = out.find((s) => s.id === d.id);
    if (!cur) out.push({ ...d });
    else if (cur.piou === undefined) cur.piou = d.piou; // on ajoute la balise manquante, rien d'autre
  }
  return out;
}

const state = {
  sites: withDefaults(store.get("sites", null)),
  limits: { ...DEFAULT_LIMITS, ...store.get("limits", {}) },
  siteId: store.get("siteId", "sapenay"),
  dayIdx: 1, hourSel: null, days: [], fetchedAt: null, fromCache: false, error: null, loading: false,
  live: null
};

store.set("sites", state.sites);

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const r0 = (v) => (v == null || Number.isNaN(v) ? "–" : Math.round(v));
const el = (form, name) => form.elements.namedItem(name);
const site = () => state.sites.find((s) => s.id === state.siteId) || state.sites[0];

// ---------- Wind helpers ----------
const CARD = ["N", "NNE", "NE", "ENE", "E", "ESE", "SE", "SSE", "S", "SSO", "SO", "OSO", "O", "ONO", "NO", "NNO"];
const cardinal = (d) => (d == null ? "–" : CARD[Math.round(((d % 360) + 360) % 360 / 22.5) % 16]);
const inSector = (d, a, b) => (a <= b ? d >= a && d <= b : d >= a || d <= b);
const angleGap = (x, y) => { const t = Math.abs(x - y) % 360; return t > 180 ? 360 - t : t; };
function sectorGap(d, a, b) {
  if (inSector(d, a, b)) return 0;
  return Math.min(angleGap(d, a), angleGap(d, b));
}

// Date et heure locales (Europe/Paris) d'un instant, pour retrouver l'heure de prévision correspondante
function parisParts(ts) {
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Europe/Paris", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", hour12: false
  }).formatToParts(new Date(ts));
  const g = (t) => parts.find((x) => x.type === t).value;
  return { date: `${g("year")}-${g("month")}-${g("day")}`, hour: +g("hour") % 24 };
}

function ago(ms) {
  const m = Math.round(ms / 60000);
  if (m < 1) return "à l'instant";
  if (m < 60) return `il y a ${m} min`;
  const h = Math.round(m / 60);
  return h < 24 ? `il y a ${h} h` : `il y a ${Math.round(h / 24)} j`;
}

// ---------- Evaluation ----------
function evaluate(h, s, L) {
  const reasons = [];
  let level = 0;
  const flag = (l, msg, tag) => { level = Math.max(level, l); reasons.push({ l, msg, tag }); };

  // Pluie
  if ((h.pr ?? 0) >= 0.3 || (h.pp ?? 0) >= 60) flag(2, `Pluie probable (${r0(h.pp)} %)`, "pluie");
  else if ((h.pp ?? 0) >= 30) flag(1, `Risque d'averse (${r0(h.pp)} %)`, "risque d'averse");

  // Direction du vent au déco
  if (h.ws != null && h.wd != null) {
    if (h.ws < 6) flag(0, "Vent météo faible : la brise de pente devrait s'installer");
    else {
      const gap = sectorGap(h.wd, s.secMin, s.secMax);
      if (gap === 0) flag(0, `Vent ${cardinal(h.wd)} dans l'axe du déco`);
      else if (gap <= 30) flag(1, `Vent ${cardinal(h.wd)} travers au déco`, "vent travers");
      else flag(2, `Vent ${cardinal(h.wd)} hors secteur : déco sous le vent possible`, "vent hors secteur");
    }
  }

  // Force et rafales
  if (h.ws != null) {
    if (h.ws > L.maxWind) flag(2, `Vent moyen ${r0(h.ws)} km/h, au-dessus de ta limite`, "vent trop fort");
    else if (h.ws > L.maxWind * 0.8) flag(1, `Vent moyen ${r0(h.ws)} km/h, proche de ta limite`, "vent soutenu");
  }
  if (h.wg != null) {
    if (h.wg > L.maxGust) flag(2, `Rafales ${r0(h.wg)} km/h`, "rafales");
    else if (h.ws != null && h.wg - h.ws > L.maxGustDelta) flag(1, `Vent irrégulier (rafales ${r0(h.wg)} km/h)`, "vent irrégulier");
  }

  // Altitude
  if (h.w850 != null) {
    if (h.w850 > L.maxAlt) flag(2, `Vent fort vers 1500 m (${r0(h.w850)} km/h ${cardinal(h.d850)})`, "vent fort en altitude");
    else if (h.w850 > L.maxAlt * 0.75) flag(1, `Vent soutenu vers 1500 m (${r0(h.w850)} km/h)`, "vent soutenu en altitude");
  }
  if (h.w700 != null && h.d700 != null && h.d700 >= 135 && h.d700 <= 225 && h.w700 >= 25) {
    flag(h.w700 >= 40 ? 2 : 1, `Flux de sud vers 3000 m (${r0(h.w700)} km/h) : risque de foehn et de turbulences`, "flux de sud");
  }

  // Instabilité
  if (h.cape != null) {
    if (h.cape >= L.capeStop) flag(2, `Masse d'air très instable (CAPE ${r0(h.cape)}) : risque orageux`, "risque orageux");
    else if (h.cape >= L.capeWarn) flag(1, `Masse d'air instable (CAPE ${r0(h.cape)}) : thermiques musclés`, "masse d'air instable");
  }

  // Base des nuages (estimation par l'écart température / point de rosée)
  let base = null;
  if (h.t != null && h.td != null) {
    base = s.alt + Math.max(0, h.t - h.td) * 125;
    if ((h.cl ?? 0) >= 50 && base - s.alt < L.minBase) {
      flag(base - s.alt < 200 ? 2 : 1, `Nuages bas vers ${Math.round(base / 50) * 50} m`, "nuages bas");
    }
  }
  return { level, reasons, base };
}

function bestWindow(hours, L) {
  let best = null, cur = null;
  for (const h of hours) {
    const open = h.hour >= L.startHour && h.hour <= L.endHour;
    if (open && h.ev.level === 0) {
      if (!cur) cur = { from: h.hour, to: h.hour };
      else cur.to = h.hour;
      if (!best || cur.to - cur.from > best.to - best.from) best = { ...cur };
    } else cur = null;
  }
  return best;
}

function dayVerdict(day, L) {
  const open = day.hours.filter((h) => h.hour >= L.startHour && h.hour <= L.endHour);
  const win = bestWindow(day.hours, L);
  const counts = [0, 0, 0];
  open.forEach((h) => counts[h.ev.level]++);
  // Principales raisons de blocage sur la journée
  const tally = {};
  open.forEach((h) => h.ev.reasons.filter((r) => r.l > 0 && r.tag).forEach((r) => {
    tally[r.tag] = tally[r.tag] || { n: 0, l: 0, tag: r.tag };
    tally[r.tag].n++; tally[r.tag].l = Math.max(tally[r.tag].l, r.l);
  }));
  const top = Object.values(tally).sort((a, b) => b.l - a.l || b.n - a.n).slice(0, 3).map((t) => t.tag);
  if (win && win.to - win.from >= 1) return { level: 0, title: "Volable", win, top };
  if (counts[0] + counts[1] > 0) return { level: 1, title: "À surveiller", win, top };
  return { level: 2, title: "Non volable", win: null, top };
}

// ---------- Data ----------
async function load(force = false) {
  const s = site();
  if (!s) return;
  state.loading = true; state.error = null; state.live = null; renderChrome();
  await Promise.all([loadForecast(s, force), loadLive(s, force)]);
  state.loading = false;
  render();
}

async function loadForecast(s, force) {
  const key = `fc:${s.id}:${state.limits.model}`;
  try {
    const url = new URL("https://api.open-meteo.com/v1/forecast");
    url.search = new URLSearchParams({
      latitude: s.lat, longitude: s.lon, elevation: s.alt,
      hourly: HOURLY.join(","), models: state.limits.model,
      timezone: "Europe/Paris", forecast_days: FORECAST_DAYS, wind_speed_unit: "kmh"
    });
    const res = await fetch(url, { cache: force ? "reload" : "default" });
    const json = await res.json();
    if (!res.ok || json.error) throw new Error(json.reason || `Erreur ${res.status}`);
    store.set(key, { at: Date.now(), json });
    ingest(json, Date.now(), false);
  } catch (e) {
    const cached = store.get(key, null);
    state.error = navigator.onLine ? `Prévisions indisponibles : ${e.message}` : "Hors ligne.";
    if (cached) ingest(cached.json, cached.at, true);
  }
}

// ---------- Balise Pioupiou / OpenWindMap ----------
const PIOU_TTL = 3 * 60 * 1000;    // on ne redemande pas plus souvent (la balise émet toutes les ~4 min)
const PIOU_STALE = 45 * 60 * 1000; // au-delà, la mesure ne reflète plus les conditions du moment

async function loadLive(s, force = false) {
  state.live = null;
  if (!s || !s.piou) return;
  const key = `piou:${s.piou}`;
  const cached = store.get(key, null);
  if (cached && !force && Date.now() - cached.at < PIOU_TTL) { state.live = cached; return; }
  try {
    const res = await fetch(`https://api.pioupiou.fr/v1/live/${encodeURIComponent(s.piou)}`, { cache: "no-store" });
    const json = await res.json();
    const d = json && json.data;
    if (!res.ok || !d || !d.measurements) throw new Error("balise injoignable");
    const m = d.measurements;
    const live = {
      at: Date.now(), id: d.id, name: (d.meta && d.meta.name) || `Balise ${d.id}`,
      date: m.date ? Date.parse(m.date) : null,
      ws: m.wind_speed_avg, wg: m.wind_speed_max, wmin: m.wind_speed_min, wd: m.wind_heading,
      on: !d.status || d.status.state === "on"
    };
    store.set(key, live);
    state.live = live;
  } catch {
    // Hors ligne ou balise injoignable : on montre la dernière mesure connue, son âge fait foi
    state.live = cached ? { ...cached, offline: true } : { id: s.piou, failed: true };
  }
}

async function refreshLive(force = false) {
  const s = site();
  if (!s || !s.piou) return;
  await loadLive(s, force);
  render();
}

// Heure de prévision correspondant à un instant donné (null la nuit, hors 7 h – 20 h)
function forecastAt(ts) {
  const { date, hour } = parisParts(ts);
  const d = state.days.find((x) => x.date === date);
  return d ? d.hours.find((h) => h.hour === hour) || null : null;
}

// Ce que la mesure dit, et ce qu'elle dit du modèle
function liveNotes(lv, fc, s, L) {
  const out = [];
  if (lv.wd != null && lv.ws >= 3) {
    const gap = sectorGap(lv.wd, s.secMin, s.secMax);
    if (gap === 0) out.push({ l: 0, msg: `Vent ${cardinal(lv.wd)} dans l'axe du déco` });
    else if (gap <= 30) out.push({ l: 1, msg: `Vent ${cardinal(lv.wd)} travers au déco` });
    else out.push({ l: 2, msg: `Vent ${cardinal(lv.wd)} hors secteur : déco sous le vent` });
  } else {
    out.push({ l: 0, msg: "Vent nul ou très faible à la balise" });
  }
  if (lv.wg != null && lv.wg > L.maxGust) out.push({ l: 2, msg: `Rafales ${r0(lv.wg)} km/h, au-dessus de ta limite` });
  else if (lv.ws != null && lv.ws > L.maxWind) out.push({ l: 2, msg: `Vent moyen ${r0(lv.ws)} km/h, au-dessus de ta limite` });
  else if (lv.ws != null && lv.wg != null && lv.wg - lv.ws > L.maxGustDelta) out.push({ l: 1, msg: `Vent irrégulier : ${r0(lv.ws)} à ${r0(lv.wg)} km/h` });

  if (fc && fc.ws != null && lv.ws != null) {
    const d = lv.ws - fc.ws;
    if (Math.abs(d) < 5) out.push({ l: 0, msg: `Le modèle colle à la mesure à cette heure` });
    else out.push({ l: 1, msg: `Le modèle ${d > 0 ? "sous-estime" : "surestime"} le vent de ${r0(Math.abs(d))} km/h à cette heure` });
    if (lv.wd != null && fc.wd != null && lv.ws >= 3) {
      const dd = angleGap(lv.wd, fc.wd);
      if (dd > 45) out.push({ l: 1, msg: `Direction décalée de ${r0(dd)}° par rapport au modèle` });
    }
  }
  return out;
}

function ingest(json, at, fromCache) {
  const H = json.hourly, s = site(), L = state.limits;
  const pick = (k, i) => (H[k] ? H[k][i] : null);
  const byDate = new Map();
  H.time.forEach((t, i) => {
    const h = {
      time: t, date: t.slice(0, 10), hour: +t.slice(11, 13),
      t: pick("temperature_2m", i), td: pick("dew_point_2m", i),
      pp: pick("precipitation_probability", i), pr: pick("precipitation", i),
      cl: pick("cloud_cover_low", i), cm: pick("cloud_cover_mid", i), ch: pick("cloud_cover_high", i),
      ws: pick("wind_speed_10m", i), wd: pick("wind_direction_10m", i), wg: pick("wind_gusts_10m", i),
      w850: pick("wind_speed_850hPa", i), d850: pick("wind_direction_850hPa", i),
      w700: pick("wind_speed_700hPa", i), d700: pick("wind_direction_700hPa", i),
      cape: pick("cape", i), blh: pick("boundary_layer_height", i)
    };
    h.ev = evaluate(h, s, L);
    if (!byDate.has(h.date)) byDate.set(h.date, []);
    byDate.get(h.date).push(h);
  });
  // Sans vent prévu, l'heure est hors de portée du modèle (Météo-France s'arrête vers J+4) : on l'écarte
  // plutôt que de la noter verte faute de règle déclenchée
  state.days = [...byDate.entries()].slice(0, FORECAST_DAYS).map(([date, hours]) => {
    const day = { date, hours: hours.filter((h) => h.hour >= 7 && h.hour <= 20 && h.ws != null) };
    day.verdict = dayVerdict(day, L);
    return day;
  }).filter((d) => d.hours.length);
  state.fetchedAt = at; state.fromCache = fromCache;
  if (state.dayIdx >= state.days.length) state.dayIdx = 0;
  state.hourSel = null;
}

// ---------- Rendering ----------
const LEVEL_COLOR = ["var(--go)", "var(--warn)", "var(--stop)"];
const DAY_SHORT = ["Di", "Lu", "Ma", "Me", "Je", "Ve", "Sa"];
const cap = (t) => t.charAt(0).toUpperCase() + t.slice(1);

function arrowSvg(deg) {
  return `<svg viewBox="-10 -10 20 20" aria-hidden="true"><g transform="rotate(${deg ?? 0})"><path d="M0 -8 V6 M-4.5 2 L0 7 L4.5 2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g></svg>`;
}

function dialSvg(s, h, lv) {
  const p = (deg, r) => { const a = deg * Math.PI / 180; return [r * Math.sin(a), -r * Math.cos(a)].map((v) => v.toFixed(2)).join(" "); };
  const span = (s.secMax - s.secMin + 360) % 360;
  const sector = `M0 0 L${p(s.secMin, 50)} A50 50 0 ${span > 180 ? 1 : 0} 1 ${p(s.secMax, 50)} Z`;
  const arrow = (deg, cls, len) => deg == null ? "" :
    `<g transform="rotate(${deg})"><line class="${cls}" x1="0" y1="${-len}" x2="0" y2="${len - 8}"/><path class="${cls}" d="M-6 ${len - 15} L0 ${len - 7} L6 ${len - 15}" fill="none"/></g>`;
  return `<svg class="dial" viewBox="-62 -62 124 124" role="img" aria-label="Secteur du déco et direction du vent">
    <path class="sector" d="${sector}"/>
    <circle class="ring" r="50"/>
    ${["N", "E", "S", "O"].map((c, i) => `<text class="card" x="${p(i * 90, 57).split(" ")[0]}" y="${p(i * 90, 57).split(" ")[1]}">${c}</text>`).join("")}
    ${h ? arrow(h.d850, "w850", 34) : ""}
    ${h ? arrow(h.wd, "w10", 42) : ""}
    ${lv ? arrow(lv.wd, "wlive", 50) : ""}
  </svg>`;
}

function skyText(h) {
  const tot = Math.max(h.cl ?? 0, h.cm ?? 0, h.ch ?? 0);
  if ((h.pp ?? 0) >= 50) return "Pluie";
  if ((h.cl ?? 0) >= 70) return "Couvert bas";
  if (tot >= 70) return "Couvert";
  if (tot >= 30) return "Nuageux";
  return "Dégagé";
}

function liveCard() {
  const s = site(), L = state.limits, lv = state.live;
  if (!s || !s.piou) return "";
  if (!lv || lv.failed) {
    return `<section class="live"><h2><span class="pulse off"></span>En direct au déco<span class="age">balise injoignable</span></h2>
      <p class="stale">Aucune mesure reçue de la balise n° ${esc(s.piou)}. Vérifie ta connexion, ou le numéro dans « Mes sites ».</p></section>`;
  }
  const age = Date.now() - (lv.date || lv.at);
  const fresh = age <= PIOU_STALE;
  const fc = fresh ? forecastAt(lv.date || lv.at) : null;
  const head = (stale) => `<h2><span class="pulse${stale ? " off" : ""}"></span>En direct au déco<span class="age">mesure ${esc(ago(age))}${lv.offline ? " · hors ligne" : ""}</span></h2>
    <span class="bname">Balise ${esc(lv.name || `n° ${lv.id}`)}</span>`;

  if (!fresh) {
    return `<section class="live">${head(true)}
      <p class="stale">La balise n'a rien envoyé depuis ${esc(ago(age).replace(/^il y a /, ""))} : pas de comparaison possible avec la prévision.${lv.on === false ? " Elle est signalée hors service." : ""}</p></section>`;
  }

  // Sous 3 km/h la girouette tourne au hasard : on n'affiche ni flèche ni direction
  const dirKnown = lv.wd != null && lv.ws >= 3;
  const meas = `<div class="col meas"><span class="lbl">Mesuré maintenant</span>
      <span class="val">${dirKnown ? arrowSvg(lv.wd) : ""}<span>${r0(lv.ws)} km/h${dirKnown ? ` ${cardinal(lv.wd)}` : ""}</span></span>
      <small>rafales ${r0(lv.wg)} km/h</small></div>`;
  const pred = fc
    ? `<div class="col"><span class="lbl">Prévu pour ${fc.hour} h</span>
         <span class="val">${arrowSvg(fc.wd)}<span>${r0(fc.ws)} km/h ${cardinal(fc.wd)}</span></span>
         <small>rafales ${r0(fc.wg)} km/h</small></div>`
    : `<div class="col"><span class="lbl">Prévu</span><span class="val">–</span><small>${state.days.length ? "hors plage horaire" : "pas de prévision"}</small></div>`;

  const notes = liveNotes(lv, fc, s, L).sort((a, b) => b.l - a.l);
  return `<section class="live">${head(false)}
    <div class="cmp">${meas}${pred}</div>
    <ul class="reasons" style="margin-top:10px">${notes.map((r) => `<li><span class="dot l${r.l}"></span><span>${esc(r.msg)}</span></li>`).join("")}</ul>
  </section>`;
}

function renderChrome() {
  const s = site();
  $("siteName").textContent = s ? s.name : "Aucun site";
  $("siteMeta").textContent = s ? `Déco ${s.alt} m, vent favorable ${cardinal(s.secMin)} à ${cardinal(s.secMax)}` : "";
  $("refreshBtn").classList.toggle("spin", state.loading);
}

function render() {
  renderChrome();
  const L = state.limits, s = site();

  // Tabs
  $("days").innerHTML = state.days.map((d, i) => {
    const dt = new Date(d.date + "T12:00");
    const full = dt.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
    return `<button class="day" role="tab" aria-selected="${i === state.dayIdx}" data-day="${i}" aria-label="${i === 0 ? `Aujourd'hui, ${full}` : full}">
      <span class="pip" style="background:${LEVEL_COLOR[d.verdict.level]}"></span>
      <span class="d1">${i === 0 ? "Auj" : DAY_SHORT[dt.getDay()]}</span><span class="d2">${dt.getDate()}</span></button>`;
  }).join("");

  $("live").innerHTML = liveCard();

  $("banner").innerHTML = state.error
    ? `<div class="banner">${esc(state.error)}${state.fromCache ? " Affichage des dernières prévisions enregistrées." : " Vérifie ta connexion puis actualise."}</div>` : "";

  const day = state.days[state.dayIdx];
  if (!day) { $("main").innerHTML = `<p class="empty">Aucune prévision pour l'instant. Actualise pour charger les données.</p>`; renderStatus(); return; }

  const v = day.verdict;
  if (state.hourSel == null) {
    const mid = v.win ? Math.round((v.win.from + v.win.to) / 2) : 13;
    state.hourSel = mid;
  }
  const sel = day.hours.find((h) => h.hour === state.hourSel) || day.hours[0];
  const winTxt = v.win ? (v.win.from === v.win.to ? `Créneau vers ${v.win.from} h` : `Créneau ${v.win.from} h – ${v.win.to + 1} h`) : "Pas de créneau favorable";
  const why = v.level === 0 ? (v.top.length ? `Hors créneau : ${v.top.join(", ")}.` : "Conditions dans tes limites sur la journée.")
    : (v.top.length ? `${cap(v.top.join(", "))}.` : "");
  const last = day.hours[day.hours.length - 1].hour;
  const caveat = [
    state.dayIdx >= 3 ? `À J+${state.dayIdx}, c'est une tendance : à reconfirmer la veille.` : "",
    last < 20 ? `Ce modèle ne prévoit pas au-delà de ${last + 1} h ce jour-là.` : ""
  ].filter(Boolean).join(" ");

  const ev = sel.ev;
  const baseTxt = ev.base != null ? `${Math.round(ev.base / 50) * 50} m` : "–";
  // La flèche « balise » n'a de sens qu'en regard d'aujourd'hui, et seulement si la mesure est fraîche
  const lv = state.live;
  const dialLive = lv && !lv.failed && lv.wd != null && lv.ws >= 3
    && Date.now() - (lv.date || lv.at) <= PIOU_STALE
    && day.date === parisParts(Date.now()).date ? lv : null;
  const blhTxt = sel.blh != null ? `${Math.round((s.alt + sel.blh) / 100) * 100} m` : "–";

  $("main").innerHTML = `
    <section class="verdict l${v.level}" aria-live="polite">
      <div>
        <h1>${v.title}</h1>
        <p class="window">${winTxt}</p>
        ${why ? `<p class="why">${esc(why)}</p>` : ""}
        ${caveat ? `<p class="why">${esc(caveat)}</p>` : ""}
      </div>
      <div>${dialSvg(s, sel, dialLive)}<div class="dial-legend"><i></i>sol <i class="alt"></i>1500 m${dialLive ? ` <i class="bal"></i>balise` : ""}</div></div>
    </section>

    <section class="detail">
      <h2>${sel.hour} h</h2>
      <dl class="facts">
        <div><dt>Vent au déco</dt><dd>${r0(sel.ws)} km/h ${cardinal(sel.wd)}</dd></div>
        <div><dt>Rafales</dt><dd>${r0(sel.wg)} km/h</dd></div>
        <div><dt>Vers 1500 m</dt><dd>${r0(sel.w850)} km/h ${cardinal(sel.d850)}</dd></div>
        <div><dt>Base nuages</dt><dd>${baseTxt}</dd></div>
        <div><dt>Plafond thermique</dt><dd>${blhTxt}</dd></div>
        <div><dt>Température</dt><dd>${r0(sel.t)} °C</dd></div>
      </dl>
      <ul class="reasons">${ev.reasons.sort((a, b) => b.l - a.l).map((r) => `<li><span class="dot l${r.l}"></span><span>${esc(r.msg)}</span></li>`).join("")}</ul>
      ${s.note ? `<p class="site-note">${esc(s.note)}</p>` : ""}
    </section>

    <div class="hours-head"><span>Heure</span><span>Vent / rafales</span><span>1500 m</span><span>Ciel</span><span></span></div>
    <div class="hours">${day.hours.map((h) => {
      const closed = h.hour < L.startHour || h.hour > L.endHour;
      return `<button class="hour l${h.ev.level}${closed ? " closed" : ""}" aria-pressed="${h.hour === sel.hour}" data-hour="${h.hour}">
        <span class="h">${h.hour} h</span>
        <span class="w">${arrowSvg(h.wd)}<span><b>${r0(h.ws)}</b> <small>/ ${r0(h.wg)}</small></span></span>
        <span class="w">${arrowSvg(h.d850)}<span>${r0(h.w850)}</span></span>
        <span class="sky">${skyText(h)}</span>
        <span class="dot l${h.ev.level}" aria-label="${["favorable", "à surveiller", "défavorable"][h.ev.level]}"></span>
      </button>`;
    }).join("")}</div>`;
  renderStatus();
}

function renderStatus() {
  const t = state.fetchedAt ? new Date(state.fetchedAt).toLocaleString("fr-FR", { weekday: "short", hour: "2-digit", minute: "2-digit" }) : null;
  $("status").innerHTML = `
    <p>Données <a href="https://open-meteo.com/" style="color:inherit">Open-Meteo</a>, modèle ${esc(MODELS[state.limits.model] || state.limits.model)}${t ? `, mises à jour ${t}` : ""}. Vent en km/h, flèches dans le sens où souffle le vent.</p>
    ${site() && site().piou ? `<p>Mesures de la balise <a href="https://www.openwindmap.org/PIOU_${esc(site().piou)}" style="color:inherit">OpenWindMap</a> (© contributeurs du réseau OpenWindMap).</p>` : ""}
    <p>Aide à la préparation : la décision se prend au déco, avec la balise et la manche à air sous les yeux.</p>`;
}

// ---------- Dialogs ----------
function openLimits() {
  const L = state.limits;
  $("limitsForm").innerHTML = LIMIT_FIELDS.map(([k, label, sub]) =>
    `<label class="field"><span>${label}<small>${sub}</small></span><input type="number" name="${k}" value="${L[k]}" inputmode="numeric"></label>`
  ).join("") + `
    <label class="field wide"><span>Modèle météo<small>compare-les pour voir s'ils sont d'accord</small></span>
      <select name="model">${Object.entries(MODELS).map(([k, n]) => `<option value="${k}"${k === L.model ? " selected" : ""}>${n}</option>`).join("")}</select></label>
    <div class="actions">
      <button type="button" class="btn" id="limitsReset">Valeurs débutant</button>
      <button type="submit" class="btn primary">Enregistrer</button>
    </div>`;
  $("limitsReset").onclick = () => { state.limits = { ...DEFAULT_LIMITS }; store.set("limits", state.limits); $("limitsDlg").close(); load(); };
  $("limitsDlg").showModal();
}

$("limitsForm").addEventListener("submit", () => {
  const fd = new FormData($("limitsForm"));
  const next = { ...state.limits };
  for (const [k] of LIMIT_FIELDS) { const n = parseFloat(fd.get(k)); if (!Number.isNaN(n)) next[k] = n; }
  const modelChanged = next.model !== fd.get("model");
  next.model = fd.get("model");
  state.limits = next; store.set("limits", next);
  if (modelChanged) load(); else { reevaluate(); render(); }
});

function reevaluate() {
  const s = site(), L = state.limits;
  state.days.forEach((d) => { d.hours.forEach((h) => { h.ev = evaluate(h, s, L); }); d.verdict = dayVerdict(d, L); });
  state.hourSel = null;
}

function openSites() { renderSitesList(); resetSiteForm(); $("sitesDlg").showModal(); }

function renderSitesList() {
  $("sitesList").innerHTML = state.sites.map((s) => `
    <div class="site-row">
      <div class="info"><b>${esc(s.name)}</b><small>${s.alt} m, ${cardinal(s.secMin)} à ${cardinal(s.secMax)}${s.piou ? ` · balise ${esc(s.piou)}` : ""}</small></div>
      ${s.id === state.siteId ? `<small>Affiché</small>` : `<button class="btn" data-use="${esc(s.id)}">Afficher</button>`}
      <button class="btn" data-edit="${esc(s.id)}">Modifier</button>
      ${state.sites.length > 1 ? `<button class="btn danger" data-del="${esc(s.id)}" aria-label="Supprimer ${esc(s.name)}">✕</button>` : ""}
    </div>`).join("");
}

function resetSiteForm(s) {
  const f = $("siteForm");
  f.reset();
  el(f, "id").value = s ? s.id : "";
  if (s) ["name", "lat", "lon", "alt", "secMin", "secMax", "piou", "note"].forEach((k) => { el(f, k).value = s[k] ?? ""; });
  $("siteFormTitle").textContent = s ? `Modifier ${s.name}` : "Ajouter un site";
  $("siteSubmit").textContent = s ? "Enregistrer le site" : "Ajouter le site";
}

$("sitesList").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.use) { state.siteId = b.dataset.use; store.set("siteId", state.siteId); $("sitesDlg").close(); load(); }
  if (b.dataset.edit) resetSiteForm(state.sites.find((s) => s.id === b.dataset.edit));
  if (b.dataset.del) {
    const s = state.sites.find((x) => x.id === b.dataset.del);
    if (s && confirm(`Supprimer ${s.name} ?`)) {
      state.sites = state.sites.filter((x) => x.id !== s.id); store.set("sites", state.sites);
      if (state.siteId === s.id) { state.siteId = state.sites[0].id; store.set("siteId", state.siteId); load(); }
      renderSitesList();
    }
  }
});

$("siteForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const f = e.target;
  const s = {
    id: el(f, "id").value || `s${Date.now()}`, name: el(f, "name").value.trim(),
    lat: +el(f, "lat").value, lon: +el(f, "lon").value, alt: Math.round(+el(f, "alt").value),
    secMin: ((+el(f, "secMin").value % 360) + 360) % 360, secMax: ((+el(f, "secMax").value % 360) + 360) % 360,
    piou: el(f, "piou").value.trim() ? Math.round(+el(f, "piou").value) : null,
    note: el(f, "note").value.trim()
  };
  const i = state.sites.findIndex((x) => x.id === s.id);
  if (i >= 0) state.sites[i] = s; else state.sites.push(s);
  store.set("sites", state.sites);
  state.siteId = s.id; store.set("siteId", s.id);
  $("sitesDlg").close(); load();
});

$("geoBtn").addEventListener("click", () => {
  const b = $("geoBtn"), f = $("siteForm");
  if (!navigator.geolocation) { b.textContent = "Indisponible"; return; }
  b.textContent = "Recherche…";
  navigator.geolocation.getCurrentPosition(async (pos) => {
    const { latitude, longitude } = pos.coords;
    el(f, "lat").value = latitude.toFixed(4); el(f, "lon").value = longitude.toFixed(4);
    try {
      const r = await fetch(`https://api.open-meteo.com/v1/elevation?latitude=${latitude}&longitude=${longitude}`);
      const j = await r.json();
      if (j.elevation) el(f, "alt").value = Math.round(j.elevation[0]);
    } catch {}
    b.textContent = "Ma position";
  }, () => { b.textContent = "Position refusée"; }, { enableHighAccuracy: true, timeout: 10000 });
});

$("siteCancel").addEventListener("click", () => $("sitesDlg").close());

// Fermer une feuille en touchant le fond
document.querySelectorAll("dialog").forEach((d) => d.addEventListener("click", (e) => { if (e.target === d) d.close(); }));

// ---------- Events ----------
$("days").addEventListener("click", (e) => {
  const b = e.target.closest("[data-day]"); if (!b) return;
  state.dayIdx = +b.dataset.day; state.hourSel = null; render();
});
$("main").addEventListener("click", (e) => {
  const b = e.target.closest("[data-hour]"); if (!b) return;
  state.hourSel = +b.dataset.hour; render();
  document.querySelector(".verdict")?.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
});
$("refreshBtn").addEventListener("click", () => load(true));
$("siteBtn").addEventListener("click", openSites);
$("sitesBtn").addEventListener("click", openSites);
$("limitsBtn").addEventListener("click", openLimits);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  if (state.fetchedAt && Date.now() - state.fetchedAt > 30 * 60 * 1000) load();
  else refreshLive();
});

// La balise émet toutes les ~4 min : on la resuit en continu, sans retoucher aux prévisions
setInterval(() => { if (document.visibilityState === "visible") refreshLive(); }, 4 * 60 * 1000);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

load();
</script>
</body>
</html>
