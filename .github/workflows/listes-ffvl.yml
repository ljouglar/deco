# Chaque nuit, après la publication de la FFVL sur data.gouv.fr (vers 2 h 20 UTC) : régénère les listes de balises et
# de terrains, et publie une nouvelle version de l'appli seulement si elles ont changé. Un échec envoie un e-mail.
name: Listes FFVL

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  rafraichir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Régénérer les listes
        run: python3 tools/ffvl_snapshot.py
      - name: Publier si elles ont changé
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- balises-ffvl.json terrains-ffvl.json; then
            echo "Listes inchangées, pas de nouvelle version."
            exit 0
          fi
          git diff --stat -- balises-ffvl.json terrains-ffvl.json
          # Toute modification doit changer CACHE, sinon les téléphones gardent l'ancienne version
          python3 -I -c "import pathlib, re; p = pathlib.Path('sw.js'); p.write_text(re.sub(r'deco-v(\d+)', lambda m: f'deco-v{int(m[1]) + 1}', p.read_text(), count=1))"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add balises-ffvl.json terrains-ffvl.json sw.js
          git commit -m "Rafraîchit les listes FFVL"
          git pull --rebase
          git push
          # Une poussée faite avec ce jeton ne déclenche pas toujours GitHub Pages : on le demande
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds"
